<!-- MV3 forbids inline <script>, so all logic lives in popup.js. -->
<meta charset="utf-8" />
<title>Log Application</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  input, select, button { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
  button { margin-top: 12px; padding: 8px; font-weight: 600; cursor: pointer; }
  #msg { margin: 8px 0 0; min-height: 1em; }
  #msg.error { color: #c00; }
  #msg.ok { color: #060; }
  .hint { font-weight: 400; color: #666; font-size: 11px; }
  [hidden] { display: none; }
  #toggle { background: none; border: none; color: #06c; padding: 0; margin-top: 10px;
            width: auto; font: inherit; cursor: pointer; text-decoration: underline; }
  #list table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  #list td { padding: 4px 4px; border-bottom: 1px solid #8883; vertical-align: top; }
  #list .co { font-weight: 600; }
  #list .meta { color: #888; font-size: 11px; }
  #list .st { font-size: 11px; white-space: nowrap; }
  #list .empty { color: #888; }
</style>

<section id="setup" hidden>
  <label for="key">API key <span class="hint">saved to this browser only</span></label>
  <input id="key" type="password" autocomplete="off" />
  <button id="saveKey">Save key</button>
</section>

<form id="form" hidden>
  <label for="company">Company</label>
  <input id="company" required />

  <label for="role">Role</label>
  <input id="role" required />

  <label for="location">Location</label>
  <input id="location" />

  <label for="date_applied">Date applied</label>
  <input id="date_applied" type="date" required />

  <label for="status">Status</label>
  <select id="status">
    <option>Applied</option>
    <option>OA</option>
    <option>Interview</option>
    <option>Offer</option>
    <option>Rejected</option>
  </select>

  <button type="submit" id="save">Save Application</button>
</form>

<button id="toggle" hidden>View saved applications</button>

<section id="list" hidden></section>

<p id="msg"></p>

<script src="popup.js"></script>
